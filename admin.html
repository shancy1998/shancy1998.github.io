<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Login | Shancy Security Systems</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-page {
            min-height: 100vh;
            padding: 72px 20px;
            background: linear-gradient(180deg, #08111f 0%, #0d1729 30%, #091323 100%);
        }

        .admin-shell {
            max-width: 760px;
            margin: 0 auto;
        }

        .admin-card {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(20, 42, 69, 0.12);
            border-radius: 10px;
            padding: 32px;
            box-shadow: 0 18px 48px rgba(16, 29, 49, 0.12);
            color: #142a45;
        }

        .admin-card,
        .admin-card p,
        .admin-card label,
        .admin-card small,
        .admin-card figcaption {
            color: #142a45;
        }

        .admin-card .eyebrow.accent {
            color: #12645e;
            background: #e9f8f5;
            border-color: #b9e8df;
        }

        .admin-card a:not(.cta) {
            color: #155e9a;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .admin-card h1 {
            margin-top: 0;
            color: #142a45;
        }

        .admin-form {
            display: grid;
            gap: 16px;
        }

        .admin-form label {
            display: grid;
            gap: 7px;
            font-weight: 600;
            color: #142a45;
        }

        .admin-form input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border: 1px solid #c8d2df;
            border-radius: 5px;
            font: inherit;
            color: #142a45;
        }

        .admin-form input:focus {
            outline: 2px solid #e6a23c;
            outline-offset: 1px;
        }

        .admin-message {
            min-height: 24px;
            color: #8b2f2f;
            margin-top: 12px;
        }

        .admin-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .admin-toolbar .cta.secondary {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            border: 2px solid #e6a23c;
            border-radius: 999px;
            background: #142a45;
            color: #fff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
        }

        .admin-toolbar .cta.secondary:hover {
            background: #203b5b;
        }

        .admin-upload-actions .cta.secondary {
            border: 1px solid #9aabba;
            background: #fff;
            color: #142a45;
        }

        .admin-upload-actions .cta.secondary:hover:not(:disabled) {
            background: #f5f8fb;
        }

        .admin-dropzone {
            display: grid;
            min-height: 190px;
            place-content: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 24px;
            border: 2px dashed #9aabba;
            border-radius: 8px;
            background: #f5f8fb;
            color: #40546b;
            text-align: center;
            cursor: pointer;
            transition: border-color 160ms ease, background 160ms ease;
        }

        .admin-dropzone:hover,
        .admin-dropzone.drag-over {
            border-color: #e6a23c;
            background: #fffaf0;
        }

        .admin-dropzone strong {
            color: #142a45;
            font-size: 1.1rem;
        }

        .admin-dropzone-icon {
            color: #d18a24;
            font-size: 2rem;
            line-height: 1;
        }

        .admin-dropzone input {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
        }

        .admin-dropzone:focus-within {
            outline: 2px solid #e6a23c;
            outline-offset: 3px;
        }

        .admin-dropzone[aria-disabled="true"] {
            cursor: wait;
            opacity: 0.65;
        }

        .admin-target-select {
            width: 100%;
            box-sizing: border-box;
            margin: 8px 0 20px;
            padding: 13px 14px;
            border: 1px solid #c8d2df;
            border-radius: 5px;
            background: #fff;
            color: #142a45;
            font: inherit;
        }

        .admin-preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .admin-preview-card {
            display: grid;
            gap: 8px;
            margin: 0;
            color: #40546b;
            font-size: 0.9rem;
        }

        .admin-preview-card img {
            display: block;
            width: 100%;
            max-height: 240px;
            aspect-ratio: 4 / 3;
            object-fit: contain;
            border: 1px solid #d9e0e8;
            border-radius: 6px;
            background: #f5f8fb;
        }

        .admin-upload-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .admin-upload-actions button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .admin-hidden {
            display: none;
        }

        @media (max-width: 560px) {
            .admin-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body class="admin-page">
    <main class="admin-shell">
        <section class="admin-card" id="login-panel">
            <span class="eyebrow accent">Private Area</span>
            <h1>Admin Login</h1>
            <p>Sign in to manage website images.</p>

            <form class="admin-form" id="login-form">
                <label>Email
                    <input type="email" id="admin-email" autocomplete="email" required>
                </label>

                <label>Password
                    <input type="password" id="admin-password" autocomplete="current-password" required>
                </label>

                <button class="cta primary" type="submit">Log in</button>
            </form>

            <p class="admin-message" id="login-message" role="status"></p>
            <a href="index.html">Back to website</a>
        </section>

        <section class="admin-card admin-hidden" id="dashboard-panel">
            <div class="admin-toolbar">
                <div>
                    <span class="eyebrow accent">Quick Upload</span>
                    <h1>Upload Images</h1>
                </div>
                <button class="cta secondary" id="logout-button" type="button">Log out</button>
            </div>

            <form id="upload-form">
                <label for="image-target">Choose where the image should appear</label>
                <select class="admin-target-select" id="image-target">
                    <option value="cctv-camera">CCTV Camera Systems</option>
                    <option value="fire-alarm">Fire Alarm Systems</option>
                    <option value="access-control">Access Control</option>
                    <option value="em-locks">EM &amp; Magnetic Locks</option>
                    <option value="electric-strike-locks">Electric Strike Locks</option>
                    <option value="biometric-attendance">Biometric Attendance</option>
                    <option value="theft-alarm">Theft Alarm Systems</option>
                    <option value="intrusion-detection">Intrusion Detection</option>
                    <option value="video-door-phones">Video Door Phones</option>
                </select>

                <div class="admin-preview-grid">
                    <figure class="admin-preview-card admin-hidden" id="current-image-panel">
                        <img id="current-image" alt="Current image for selected website section">
                        <figcaption>Current image on the website</figcaption>
                    </figure>
                    <figure class="admin-preview-card admin-hidden" id="selected-image-panel">
                        <img id="selected-image" alt="Preview of the image ready to upload">
                        <figcaption id="selected-image-name"></figcaption>
                    </figure>
                </div>

                <label class="admin-dropzone" id="upload-dropzone" for="image-file">
                    <span class="admin-dropzone-icon" aria-hidden="true">↑</span>
                    <strong>Drop one image here</strong>
                    <span>or click to choose from your device</span>
                    <small>Image files only</small>
                    <input type="file" id="image-file" accept="image/*">
                </label>

                <div class="admin-upload-actions">
                    <button class="cta primary" id="save-image-button" type="submit" disabled>Save / Replace Image</button>
                    <button class="cta secondary" id="remove-image-button" type="button" disabled>Remove Current Image</button>
                </div>
            </form>

            <p class="admin-message" id="dashboard-message" role="status"></p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js?v=admin-controls-20261008"></script>
</body>

</html>
