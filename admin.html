<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Shancy Security Systems</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-page {
            min-height: 100vh;
            padding: 72px 20px;
            background: linear-gradient(180deg, #08111f 0%, #0d1729 30%, #091323 100%);
        }

        .admin-shell {
            max-width: 760px;
            margin: 0 auto;
        }

        .admin-card {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(20, 42, 69, 0.12);
            border-radius: 10px;
            padding: 32px;
            box-shadow: 0 18px 48px rgba(16, 29, 49, 0.12);
            color: #142a45;
        }

        .admin-card h1 {
            margin-top: 0;
            color: #142a45;
        }

        .admin-form {
            display: grid;
            gap: 16px;
        }

        .admin-form label {
            display: grid;
            gap: 7px;
            font-weight: 600;
            color: #142a45;
        }

        .admin-form input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border: 1px solid #c8d2df;
            border-radius: 5px;
            font: inherit;
            color: #142a45;
        }

        .admin-form input:focus {
            outline: 2px solid #e6a23c;
            outline-offset: 1px;
        }

        .admin-message {
            min-height: 24px;
            color: #8b2f2f;
            margin-top: 12px;
        }

        .admin-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .admin-dropzone {
            display: grid;
            min-height: 190px;
            place-content: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 24px;
            border: 2px dashed #9aabba;
            border-radius: 8px;
            background: #f5f8fb;
            color: #40546b;
            text-align: center;
            cursor: pointer;
            transition: border-color 160ms ease, background 160ms ease;
        }

        .admin-dropzone:hover,
        .admin-dropzone.drag-over {
            border-color: #e6a23c;
            background: #fffaf0;
        }

        .admin-dropzone strong {
            color: #142a45;
            font-size: 1.1rem;
        }

        .admin-dropzone-icon {
            color: #d18a24;
            font-size: 2rem;
            line-height: 1;
        }

        .admin-dropzone input {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
        }

        .admin-dropzone:focus-within {
            outline: 2px solid #e6a23c;
            outline-offset: 3px;
        }

        .admin-dropzone[aria-disabled="true"] {
            cursor: wait;
            opacity: 0.65;
        }

        .admin-hidden {
            display: none;
        }

        @media (max-width: 560px) {
            .admin-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body class="admin-page">
    <main class="admin-shell">
        <section class="admin-card" id="login-panel">
            <span class="eyebrow accent">Private Area</span>
            <h1>Admin Login</h1>
            <p>Sign in to manage website images.</p>

            <form class="admin-form" id="login-form">
                <label>Email
                    <input type="email" id="admin-email" autocomplete="email" required>
                </label>

                <label>Password
                    <input type="password" id="admin-password" autocomplete="current-password" required>
                </label>

                <button class="cta primary" type="submit">Log in</button>
            </form>

            <p class="admin-message" id="login-message" role="status"></p>
            <a href="index.html">Back to website</a>
        </section>

        <section class="admin-card admin-hidden" id="dashboard-panel">
            <div class="admin-toolbar">
                <div>
                    <span class="eyebrow accent">Quick Upload</span>
                    <h1>Upload Images</h1>
                </div>
                <button class="cta secondary" id="logout-button" type="button">Log out</button>
            </div>

            <label class="admin-dropzone" id="upload-dropzone" for="image-file">
                <span class="admin-dropzone-icon" aria-hidden="true">↑</span>
                <strong>Drop images here</strong>
                <span>or click to choose from your device</span>
                <small>Image files only · You can select multiple images</small>
                <input type="file" id="image-file" accept="image/*" multiple>
            </label>

            <p class="admin-message" id="dashboard-message" role="status"></p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>
</body>

</html>
